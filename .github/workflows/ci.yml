name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Format check, tests and requirements traceability gate
        run: ./mvnw -B verify
      - name: Build the upstream-mocks image
        run: docker build -f upstream-mocks/Dockerfile .
      - name: Build the aggregator image
        run: docker build -f aggregator/Dockerfile .
